<!DOCTYPE html>
<html lang="zh-CN">
<head>

<!-- KILLSWITCH v2 -->
<script>
(function () {
  var KEY = 'toolkit-cleaned-v2';
  if (localStorage.getItem(KEY)) return;
  localStorage.setItem(KEY, '1');
  (async function () {
    try {
      if ('serviceWorker' in navigator) { var regs = await navigator.serviceWorker.getRegistrations(); for (var r of regs) { try { await r.unregister(); } catch (_) {} } }
      if ('caches' in window) { var ks = await caches.keys(); for (var k of ks) { try { await caches.delete(k); } catch (_) {} } }
      try { localStorage.removeItem('toolkit-cursor'); } catch (_) {}
      try { localStorage.removeItem('toolkit-theme'); } catch (_) {}
      var stale = document.getElementById('__toolkit_cursor_style__');
      if (stale) stale.remove();
      document.documentElement.removeAttribute('data-theme');
      location.reload();
    } catch (e) { console.warn('[cleanup]', e); }
  })();
})();
</script>
<title>视频去水印 · Dobby</title>
<link rel="stylesheet" href="../assets/shared.css" />
<style>
  .preview-wrap {
    position: relative;
    display: inline-block;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: #000;
  }
  .preview-wrap video {
    display: block;
    max-width: 100%;
    height: auto;
  }
  .mask-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    user-select: none;
    touch-action: none;
  }
  .mask-list {
    list-style: none;
    margin: 0;
    padding: 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
  }
  .mask-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    background: rgba(238, 68, 68, 0.06);
  }
  .mask-list li button {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(255, 128, 128, 0.4);
    color: #ff8080;
    padding: 2px 8px;
    font-size: 11px;
    box-shadow: none;
    border-radius: 6px;
    cursor: pointer;
  }
  .mask-list li button:hover { background: rgba(255, 128, 128, 0.12); }
  .mask-empty {
    font-size: 11px;
    color: var(--muted);
    padding: 8px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
  }
  #outputBox {
    margin-top: 16px;
    display: none;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  #outputBox video {
    width: 100%;
    max-width: 100%;
    border-radius: var(--radius);
    background: #000;
  }
  .vw-warn {
    background: rgba(245, 165, 75, 0.08);
    border: 1px solid rgba(245, 165, 75, 0.3);
    border-left: 3px solid rgba(245, 165, 75, 0.7);
    color: var(--text-soft);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    line-height: 1.55;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div class="tool-layout">
  <div class="sidebar">
    <h1>🎭 视频去水印</h1>

    <div class="drop-zone" id="dropZone">
      <p data-i18n="vw.drop.title">📂 拖入视频文件</p>
      <p class="hint" data-i18n-html="vw.drop.hint">
        MP4 / WebM / MOV<br/>
        拖入后在右侧画矩形圈水印
      </p>
      <input type="file" id="fileInput" accept="video/*" style="display:none" />
    </div>

    <h2 data-i18n="vw.masks.title">水印区域</h2>
    <div class="info" style="margin-bottom:8px" data-i18n="vw.masks.help">在右侧画面上**拖动鼠标**圈出每个水印的位置。多个水印(台标 + 字幕 + 弹幕等)可框多个矩形。</div>
    <ul class="mask-list" id="maskList"></ul>
    <div class="mask-empty" id="maskEmpty" data-i18n="vw.masks.empty">还没选任何区域</div>
    <button id="clearMasksBtn" class="secondary" disabled data-i18n="vw.masks.clear">清空选区</button>

    <h2 data-i18n="vw.method.title">填充算法</h2>
    <div class="field">
      <select id="method">
        <option value="corner" data-i18n="vw.method.corner">角落插值(快 · 纯色/渐变背景最自然)</option>
        <option value="edge" data-i18n="vw.method.edge">边缘延伸(适合纹理背景)</option>
        <option value="solid" data-i18n="vw.method.solid">纯色遮挡(最快粗暴)</option>
      </select>
    </div>
    <div class="field" id="solidColorRow" style="display:none">
      <label data-i18n="vw.solidColor">遮挡颜色</label>
      <input type="text" id="solidColor" value="#000000" />
    </div>

    <h2 data-i18n="common.export">输出</h2>
    <div class="field">
      <label data-i18n="vw.format">格式</label>
      <select id="format">
        <option value="mp4" data-i18n="vw.fmt.mp4">MP4(H.264 · 通用,需要浏览器支持)</option>
        <option value="webm" data-i18n="vw.fmt.webm">WebM(VP9 · 始终支持)</option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="vw.bitrate">码率 (kbps)</label>
      <input type="number" id="bitrate" value="3000" min="500" max="20000" />
    </div>
    <div class="field">
      <label data-i18n="common.filename">文件名前缀</label>
      <input type="text" id="filename" value="video_clean" />
    </div>

    <button id="processBtn" disabled data-i18n="vw.process">开始处理</button>
    <button id="clearBtn" class="secondary" data-i18n="common.clear">清空</button>

    <div class="vw-warn" data-i18n-html="vw.warn">
      ⏱ <strong>处理速度 = 视频时长 × 1</strong>(MediaRecorder 边播边录,这样能保留原视频音频)<br/>
      长视频请耐心,处理期间请别切换标签页(浏览器可能暂停 rAF 渲染导致丢帧)
    </div>

    <div class="progress" id="progress"><div class="progress-bar"></div></div>
    <div class="log" id="log"></div>
  </div>

  <div class="main">
    <div class="stats" id="stats" data-i18n="vw.stats.idle">Dobby 待命 · 拖入视频开始</div>
    <div class="preview-wrap" id="previewWrap" style="display:none">
      <video id="srcVideo" controls preload="auto" playsinline muted></video>
      <canvas class="mask-overlay" id="maskOverlay"></canvas>
    </div>
    <div id="outputBox">
      <h2 style="margin-top:0" data-i18n="vw.output.title">处理结果</h2>
      <video id="outVideo" controls playsinline></video>
      <div style="margin-top:10px; display:flex; gap:10px; align-items:center">
        <button id="downloadBtn" data-i18n="common.download">💾 下载</button>
        <span class="mono" id="outInfo" style="color:var(--muted); font-size:12px"></span>
      </div>
    </div>
  </div>
</div>

<script src="../assets/shared.js"></script>
<script>
Toolkit.injectTopbar('video-watermark');

(() => {
  const { $, makeLogger, makeProgress, attachDropZone, download, newCanvas, canvasToBlob, fmtBytes } = Toolkit;
  const log = makeLogger($('log'));
  const progress = makeProgress($('progress'));
  const handoff = Toolkit.setupHandoff('video-watermark', { outputType: 'video/mp4' });

  let srcFile = null;
  let masks = [];           // [{ x, y, w, h }] in NATIVE video pixel coords
  let outBlob = null;
  let outExt = 'mp4';

  const video = $('srcVideo');
  const overlay = $('maskOverlay');
  const previewWrap = $('previewWrap');

  attachDropZone($('dropZone'), $('fileInput'), files => handleFiles(files));

  $('method').addEventListener('change', () => {
    $('solidColorRow').style.display = $('method').value === 'solid' ? '' : 'none';
  });

  async function handleFiles(files) {
    if (!files.length) return;
    const f = files[0];
    if (!f.type.startsWith('video/')) {
      log.err('请拖入视频文件(MP4 / WebM / MOV)');
      return;
    }
    srcFile = f;
    log.clear();
    masks = [];
    renderMaskList();
    $('processBtn').disabled = true;
    $('outputBox').style.display = 'none';
    outBlob = null;

    const url = URL.createObjectURL(f);
    video.src = url;
    video.muted = true;  // muted so autoplay works for the preview; we'll capture audio from the stream separately
    previewWrap.style.display = '';

    await new Promise((res, rej) => {
      video.onloadedmetadata = () => res();
      video.onerror = () => rej(new Error('视频加载失败 · 检查格式'));
    }).catch(e => log.err(e.message));

    if (!video.videoWidth) {
      log.err('视频元数据加载失败');
      return;
    }

    log.ok(`视频已加载 · ${video.videoWidth}×${video.videoHeight} · ${video.duration.toFixed(2)}s`);
    $('stats').innerHTML = `<strong>${video.videoWidth}×${video.videoHeight}</strong> · ${video.duration.toFixed(2)}s · ${fmtBytes(f.size)}`;
    sizeOverlay();
    $('processBtn').disabled = true;  // re-enabled once at least one mask exists
  }

  // ─── overlay sizing & redraw ───
  function sizeOverlay() {
    if (!video.videoWidth) return;
    // Match overlay's pixel buffer to video DISPLAYED size so rectangle drawing
    // stays crisp on hi-DPI. Internal mask coords are in NATIVE video pixels.
    const w = video.clientWidth, h = video.clientHeight;
    overlay.width = w;
    overlay.height = h;
    refreshPreview();
  }

  // Fast path used during drag: just outline + dashed in-progress rect.
  // Skips the per-mask inpaint, which would jitter as the mouse moves.
  function redrawSelection(extraRect) {
    if (!overlay.width) return;
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    const sx = overlay.width / video.videoWidth;
    const sy = overlay.height / video.videoHeight;
    for (const m of masks) {
      const rx = m.x * sx, ry = m.y * sy, rw = m.w * sx, rh = m.h * sy;
      ctx.fillStyle = 'rgba(238, 68, 68, 0.2)';
      ctx.fillRect(rx, ry, rw, rh);
      ctx.strokeStyle = '#ff8080';
      ctx.lineWidth = 2;
      ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, rh - 1);
    }
    if (extraRect) {
      ctx.fillStyle = 'rgba(80, 220, 200, 0.2)';
      ctx.fillRect(extraRect.x, extraRect.y, extraRect.w, extraRect.h);
      ctx.strokeStyle = '#50dcc8';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(extraRect.x + 0.5, extraRect.y + 0.5, extraRect.w - 1, extraRect.h - 1);
      ctx.setLineDash([]);
    }
  }

  // Live preview: for each finalized mask, apply the inpaint to the CURRENT
  // video frame and paint the result onto the overlay at that mask's position.
  // Result: the user sees the watermark literally disappear inside the
  // rectangle as soon as they finish drawing, and the preview updates as the
  // video plays / scrubs. Border still drawn so the selection is visible.
  // Falls back to plain selection rendering before metadata loads.
  function refreshPreview() {
    if (!overlay.width) return;
    if (!video.videoWidth || masks.length === 0) { redrawSelection(); return; }
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);
    const sx = overlay.width / video.videoWidth;
    const sy = overlay.height / video.videoHeight;
    // Native-resolution scratch canvas — inpaint runs at full quality, the
    // scaled drawImage to the overlay handles the display-size resampling.
    const work = newCanvas(video.videoWidth, video.videoHeight);
    const wctx = work.getContext('2d', { willReadFrequently: true });
    try { wctx.drawImage(video, 0, 0); } catch (_) { redrawSelection(); return; }
    const method = $('method').value;
    const solidHex = $('solidColor').value || '#000';
    for (const m of masks) {
      try { inpaint(wctx, m, video.videoWidth, video.videoHeight, method, solidHex); } catch (_) {}
      const ox = m.x * sx, oy = m.y * sy;
      const ow = m.w * sx, oh = m.h * sy;
      // Paint the inpainted region onto the overlay (covers the still-visible
      // watermark in the source video underneath).
      ctx.drawImage(work, m.x, m.y, m.w, m.h, ox, oy, ow, oh);
      // Then the red selection border on top so the user still sees the mask.
      ctx.strokeStyle = '#ff8080';
      ctx.lineWidth = 2;
      ctx.strokeRect(ox + 0.5, oy + 0.5, ow - 1, oh - 1);
    }
  }
  // Re-render the preview whenever the current frame changes (playback or
  // scrub) or when the user toggles inpaint method / solid color.
  video.addEventListener('timeupdate', refreshPreview);
  video.addEventListener('seeked', refreshPreview);
  video.addEventListener('play', () => { previewLoop(); });
  video.addEventListener('pause', refreshPreview);
  $('method').addEventListener('change', refreshPreview);
  $('solidColor').addEventListener('input', refreshPreview);

  // While the video plays, timeupdate fires only ~4×/s in some browsers, which
  // looks jerky for the inpaint preview. Drive a rAF loop instead — it still
  // costs almost nothing per frame for the typical small mask + corner algo.
  let _previewRaf = 0;
  function previewLoop() {
    if (video.paused || video.ended || !video.videoWidth || masks.length === 0) {
      cancelAnimationFrame(_previewRaf);
      _previewRaf = 0;
      return;
    }
    refreshPreview();
    _previewRaf = requestAnimationFrame(previewLoop);
  }

  window.addEventListener('resize', () => sizeOverlay());
  video.addEventListener('loadedmetadata', () => sizeOverlay());

  // ─── drag-to-draw rectangles ───
  let dragStart = null;
  overlay.addEventListener('pointerdown', (e) => {
    if (!video.videoWidth) return;
    overlay.setPointerCapture(e.pointerId);
    const r = overlay.getBoundingClientRect();
    dragStart = { x: e.clientX - r.left, y: e.clientY - r.top };
  });
  overlay.addEventListener('pointermove', (e) => {
    if (!dragStart) return;
    const r = overlay.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const x = Math.min(dragStart.x, cx), y = Math.min(dragStart.y, cy);
    const w = Math.abs(cx - dragStart.x), h = Math.abs(cy - dragStart.y);
    redrawSelection({ x, y, w, h });
  });
  overlay.addEventListener('pointerup', (e) => {
    if (!dragStart) return;
    const r = overlay.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const px = Math.min(dragStart.x, cx), py = Math.min(dragStart.y, cy);
    const pw = Math.abs(cx - dragStart.x), ph = Math.abs(cy - dragStart.y);
    dragStart = null;
    if (pw < 4 || ph < 4) { redrawOverlay(); return; }   // too small to be intentional
    // convert overlay pixels → native video pixels
    const sx = video.videoWidth / overlay.width;
    const sy = video.videoHeight / overlay.height;
    const m = {
      x: Math.max(0, Math.round(px * sx)),
      y: Math.max(0, Math.round(py * sy)),
      w: Math.min(video.videoWidth, Math.round(pw * sx)),
      h: Math.min(video.videoHeight, Math.round(ph * sy))
    };
    masks.push(m);
    renderMaskList();
    refreshPreview();
    $('processBtn').disabled = masks.length === 0;
  });
  overlay.addEventListener('pointercancel', () => { dragStart = null; redrawOverlay(); });

  function renderMaskList() {
    const ul = $('maskList');
    ul.innerHTML = '';
    masks.forEach((m, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>#${i + 1} · x=${m.x} y=${m.y} · ${m.w}×${m.h}</span><button data-i="${i}">删</button>`;
      li.querySelector('button').addEventListener('click', () => {
        masks.splice(i, 1);
        renderMaskList();
        refreshPreview();
        $('processBtn').disabled = masks.length === 0;
      });
      ul.appendChild(li);
    });
    $('maskEmpty').style.display = masks.length === 0 ? '' : 'none';
    $('clearMasksBtn').disabled = masks.length === 0;
  }

  $('clearMasksBtn').addEventListener('click', () => {
    masks = [];
    renderMaskList();
    refreshPreview();
    $('processBtn').disabled = true;
  });

  // ─── inpainting kernels — run per frame, per mask ───
  // Pre-allocated reusable scratch ImageData so we don't allocate per frame.
  let scratchData = null;
  function inpaint(ctx, mask, fw, fh, method, solidHex) {
    const cx = Math.max(0, mask.x), cy = Math.max(0, mask.y);
    const cw = Math.min(fw - cx, mask.w), ch = Math.min(fh - cy, mask.h);
    if (cw < 1 || ch < 1) return;

    if (method === 'solid') {
      ctx.fillStyle = solidHex || '#000';
      ctx.fillRect(cx, cy, cw, ch);
      return;
    }

    if (method === 'corner') {
      // Bilinear interpolation between 4 corner colors sampled just outside
      // the mask. Fast (4 reads + cw*ch math) and works for solid / smoothly-
      // varying backgrounds — by far the most common watermark scenario
      // (corner logo on TV-style footage).
      const tlX = Math.max(0, cx - 1), tlY = Math.max(0, cy - 1);
      const trX = Math.min(fw - 1, cx + cw), trY = Math.max(0, cy - 1);
      const blX = Math.max(0, cx - 1), blY = Math.min(fh - 1, cy + ch);
      const brX = Math.min(fw - 1, cx + cw), brY = Math.min(fh - 1, cy + ch);
      const TL = ctx.getImageData(tlX, tlY, 1, 1).data;
      const TR = ctx.getImageData(trX, trY, 1, 1).data;
      const BL = ctx.getImageData(blX, blY, 1, 1).data;
      const BR = ctx.getImageData(brX, brY, 1, 1).data;
      const id = ctx.createImageData(cw, ch);
      const d = id.data;
      const denomX = cw > 1 ? cw - 1 : 1;
      const denomY = ch > 1 ? ch - 1 : 1;
      for (let dy = 0; dy < ch; dy++) {
        const v = dy / denomY;
        const _1v = 1 - v;
        for (let dx = 0; dx < cw; dx++) {
          const u = dx / denomX;
          const w00 = (1 - u) * _1v;
          const w10 = u * _1v;
          const w01 = (1 - u) * v;
          const w11 = u * v;
          const i = (dy * cw + dx) * 4;
          d[i]     = TL[0] * w00 + TR[0] * w10 + BL[0] * w01 + BR[0] * w11;
          d[i + 1] = TL[1] * w00 + TR[1] * w10 + BL[1] * w01 + BR[1] * w11;
          d[i + 2] = TL[2] * w00 + TR[2] * w10 + BL[2] * w01 + BR[2] * w11;
          d[i + 3] = 255;
        }
      }
      ctx.putImageData(id, cx, cy);
      return;
    }

    if (method === 'edge') {
      // Per-pixel weighted blend of the 4 nearest border colors (top/bottom/
      // left/right of the mask). Each border is a strip; pixel inside picks
      // the column from top/bottom and the row from left/right and weights
      // by inverse distance to each edge. Captures gentle texture along the
      // borders better than corner interpolation.
      const topY = Math.max(0, cy - 1);
      const botY = Math.min(fh - 1, cy + ch);
      const lftX = Math.max(0, cx - 1);
      const rgtX = Math.min(fw - 1, cx + cw);
      const topStrip = ctx.getImageData(cx, topY, cw, 1).data;
      const botStrip = ctx.getImageData(cx, botY, cw, 1).data;
      const lftStrip = ctx.getImageData(lftX, cy, 1, ch).data;
      const rgtStrip = ctx.getImageData(rgtX, cy, 1, ch).data;
      const id = ctx.createImageData(cw, ch);
      const d = id.data;
      for (let dy = 0; dy < ch; dy++) {
        const dT = dy + 1, dB = ch - dy;
        for (let dx = 0; dx < cw; dx++) {
          const dL = dx + 1, dR = cw - dx;
          const wT = 1 / dT, wB = 1 / dB, wL = 1 / dL, wR = 1 / dR;
          const sw = wT + wB + wL + wR;
          const i = (dy * cw + dx) * 4;
          const tI = dx * 4, lI = dy * 4;
          d[i]     = (topStrip[tI]     * wT + botStrip[tI]     * wB + lftStrip[lI]     * wL + rgtStrip[lI]     * wR) / sw;
          d[i + 1] = (topStrip[tI + 1] * wT + botStrip[tI + 1] * wB + lftStrip[lI + 1] * wL + rgtStrip[lI + 1] * wR) / sw;
          d[i + 2] = (topStrip[tI + 2] * wT + botStrip[tI + 2] * wB + lftStrip[lI + 2] * wL + rgtStrip[lI + 2] * wR) / sw;
          d[i + 3] = 255;
        }
      }
      ctx.putImageData(id, cx, cy);
      return;
    }
  }

  // ─── main processing pipeline ───
  $('processBtn').addEventListener('click', async () => {
    if (!srcFile || masks.length === 0) return;
    $('processBtn').disabled = true;
    $('processBtn').textContent = Toolkit.T('vw.processing', null, '处理中... (≈ 视频时长)');
    progress.set(0);
    const method = $('method').value;
    const solidHex = $('solidColor').value || '#000';
    const fmt = $('format').value;
    const bitrate = (parseInt($('bitrate').value, 10) || 3000) * 1000;
    const nameRaw = $('filename').value || 'video_clean';
    const name = nameRaw.replace(/[^\w-]/g, '_');

    const w = video.videoWidth, h = video.videoHeight;
    const cv = newCanvas(w, h);
    const ctx = cv.getContext('2d', { willReadFrequently: true });

    log.dim('准备处理流(canvas → captureStream + 源音轨 → MediaRecorder)...');

    // Reset video to start
    try {
      video.currentTime = 0;
      await new Promise(res => video.onseeked = () => { video.onseeked = null; res(); });
    } catch (_) {}

    // Output stream: canvas video + source audio (if present)
    const videoStream = cv.captureStream(0);  // 0 = manual; we'll requestFrame
    const videoTrack = videoStream.getVideoTracks()[0];
    let combinedStream;
    let audioNote = '';
    try {
      const srcStream = video.captureStream();
      const audioTracks = srcStream.getAudioTracks();
      if (audioTracks.length > 0) {
        combinedStream = new MediaStream([videoTrack, ...audioTracks]);
        audioNote = `保留 ${audioTracks.length} 条音轨`;
      } else {
        combinedStream = videoStream;
        audioNote = '源视频无音频';
      }
    } catch (e) {
      combinedStream = videoStream;
      audioNote = '音频提取失败 (' + e.message + ')';
    }
    log.dim(audioNote);

    // Pick mime
    let mimeType = '';
    if (fmt === 'mp4') {
      const candidates = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E', 'video/mp4'];
      mimeType = candidates.find(m => MediaRecorder.isTypeSupported(m)) || '';
      if (!mimeType) {
        log.warn('当前浏览器 MediaRecorder 不支持 MP4,改用 WebM 输出');
      }
    }
    if (!mimeType) {
      const candidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      mimeType = candidates.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
    }
    outExt = mimeType.includes('mp4') ? 'mp4' : 'webm';
    log.dim(`输出格式:${mimeType}`);

    let recorder;
    try {
      recorder = new MediaRecorder(combinedStream, { mimeType, videoBitsPerSecond: bitrate });
    } catch (e) {
      log.err('MediaRecorder 初始化失败:' + e.message);
      $('processBtn').disabled = false;
      $('processBtn').textContent = Toolkit.T('vw.process', null, '开始处理');
      return;
    }
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

    const done = new Promise(res => { recorder.onstop = res; });
    recorder.start();

    // Render loop: draw video → inpaint → request canvas frame
    let stopped = false;
    let frameCount = 0;
    const t0 = performance.now();

    function step() {
      if (stopped) return;
      ctx.drawImage(video, 0, 0, w, h);
      for (const m of masks) inpaint(ctx, m, w, h, method, solidHex);
      // Tell the captureStream to emit a frame
      if (videoTrack.requestFrame) videoTrack.requestFrame();
      frameCount++;
      if (video.duration > 0) progress.set(video.currentTime / video.duration);
      if (video.ended) {
        stopped = true;
        // Pause briefly so any in-flight chunks land before stop()
        setTimeout(() => { try { recorder.stop(); } catch (_) {} }, 250);
        return;
      }
      requestAnimationFrame(step);
    }

    // Unmute so audio is captured (we muted earlier for preview)
    video.muted = false;
    try { await video.play(); } catch (e) {
      log.warn('视频播放失败,尝试静音再播:' + e.message);
      video.muted = true;
      try { await video.play(); } catch (e2) {
        log.err('无法播放视频:' + e2.message);
        try { recorder.stop(); } catch (_) {}
        $('processBtn').disabled = false;
        return;
      }
    }
    step();

    await done;
    const t1 = performance.now();
    progress.hide();

    const blob = new Blob(chunks, { type: mimeType });
    outBlob = blob;

    if (blob.size < 1024) {
      log.err(`输出过小(${blob.size} 字节),可能录制失败 — 试试降低码率或换 WebM 格式`);
      $('processBtn').disabled = false;
      $('processBtn').textContent = Toolkit.T('vw.process', null, '开始处理');
      return;
    }

    const outUrl = URL.createObjectURL(blob);
    $('outVideo').src = outUrl;
    $('outputBox').style.display = '';
    $('outInfo').textContent = `${frameCount} 帧 · ${fmtBytes(blob.size)} · 耗时 ${((t1 - t0) / 1000).toFixed(2)}s`;
    handoff?.setBlob(blob, `${name}.${outExt}`, mimeType.split(';')[0]);
    log.ok(`完成 · ${fmtBytes(blob.size)} · ${audioNote}`);
    $('processBtn').disabled = false;
    $('processBtn').textContent = Toolkit.T('vw.process', null, '开始处理');
    // Make the result hard to miss — page is tall; scroll the output into view
    // and flash a brief highlight so the user knows where to look.
    requestAnimationFrame(() => {
      $('outputBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
      $('outputBox').animate(
        [{ boxShadow: '0 0 0 0 rgba(var(--jade-rgb), 0)' }, { boxShadow: '0 0 0 16px rgba(var(--jade-rgb), 0.5)' }, { boxShadow: '0 0 0 0 rgba(var(--jade-rgb), 0)' }],
        { duration: 1200, easing: 'ease-out' }
      );
    });
  });

  $('downloadBtn').addEventListener('click', () => {
    if (!outBlob) return;
    const name = ($('filename').value || 'video_clean').replace(/[^\w-]/g, '_');
    download(outBlob, `${name}.${outExt}`);
  });

  $('clearBtn').addEventListener('click', () => {
    srcFile = null; masks = []; outBlob = null;
    if (video.src) URL.revokeObjectURL(video.src);
    video.removeAttribute('src');
    video.load();
    previewWrap.style.display = 'none';
    $('outputBox').style.display = 'none';
    renderMaskList();
    $('stats').textContent = Toolkit.T('vw.stats.idle', null, 'Dobby 待命 · 拖入视频开始');
    $('processBtn').disabled = true;
    log.clear();
    $('fileInput').value = '';
  });

  renderMaskList();
})();
</script>
</body>
</html>
